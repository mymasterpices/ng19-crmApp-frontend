@if(loader.loading()){
<div class="card flex justify-center items-center bg-surface-900">
    <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s"
        [style]="{ width: '50px', height: '50px' }" class="fixed top-1/2 left-1/2 z-50" ariaLabel="Loading..." />
</div>
}
<router-outlet></router-outlet>
<p-toast position="top-center"></p-toast>
