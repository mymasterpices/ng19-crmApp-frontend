<div class="grid grid-cols-1 md:grid-cols-3 gap-4 px-4 w-full">
  @if (links.length > 0) { @for (item of links; track item._id) {
  <div class="p-2">
    <p-card class="rounded-2xl shadow-md">
      <div class="p-4">
        <h3 class="text-lg font-semibold text-gray-800">
          {{ item.customerName | titlecase }}
        </h3>

        <div class="flex justify-between items-center mt-3">
          <p class="text-sm font-medium text-gray-600">Created On:</p>
          <p class="text-sm text-green-600">
            {{ item.createdAt | date }}
          </p>
        </div>

        <div class="mt-4">
          <p class="text-sm font-medium text-gray-600">Selected Products:</p>
          <div class="flex flex-wrap gap-2 mt-2">
            @for (videos of item.favVideoIds; track $index) {
            <p-tag
              value="{{ videos[0].tagNumber }}"
              class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded-md"
            />
            }
          </div>
        </div>
      </div>
    </p-card>
  </div>
  } } @else {
  <div class="col-span-full text-center text-gray-500 py-10">
    No shared links found.
  </div>
  }
</div>
