<div class="card hidden max-sm:block">
    <p-toolbar class="p-0">
        <div class="flex items-center justify-between w-full">
            <p-button icon="pi pi-plus" text [rounded]="true" routerLink="add-new"
                routerLinkActive="bg-gray-800 rounded-full text-gray-300" />

            <p-button icon="pi pi-exclamation-triangle" text [rounded]="true" routerLink="missed"
                routerLinkActive="bg-gray-800 rounded-full text-gray-300" />

            <p-button icon="pi pi-home" text [rounded]="true" routerLink="dashboard"
                routerLinkActive="bg-gray-800 rounded-full text-gray-300" />

            <p-button icon="pi pi-calendar" text [rounded]="true" routerLink="today"
                routerLinkActive="bg-gray-800 rounded-full text-gray-300" />

            <p-button icon="pi pi-sign-out" text [rounded]="true" (click)="logOut()"
                routerLinkActive="bg-gray-800 rounded-full text-gray-300" />
        </div>
    </p-toolbar>
</div>
