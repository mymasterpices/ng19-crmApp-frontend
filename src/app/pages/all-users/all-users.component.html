<p-card class="mt-3 block">
    <p-table [value]="allUsers" stripedRows size="small">
        <ng-template pTemplate="header">
            <tr>
                <th>S.No.</th>
                <th>Name</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user let-i="rowIndex">
            <tr>
                <td>{{ i + 1 }}</td>
                <td>{{ user.username | titlecase }}</td>
                <td>{{ user.role }}</td>
                <td>
                    <p-button [text]="true" severity="contrast" (click)="option.toggle($event)" icon="pi pi-ellipsis-v"
                        [rounded]="true" pTooltip="Action" tooltipPosition="bottom"></p-button>
                </td>
                <p-popover #option>
                    <p-button icon="pi pi-lock" [text]="true" severity="primary" [rounded]="true" pTooltip="Password"
                        tooltipPosition="bottom" (click)="showDialog(user._id)"></p-button>

                    <p-button icon="pi pi-trash" [text]="true" severity="danger" [rounded]="true" pTooltip="Delete"
                        tooltipPosition="bottom" (click)="deleteCustomer(user._id)"></p-button>

                </p-popover>

            </tr>

        </ng-template>

    </p-table>

</p-card>

<p-dialog header="Change Password" [modal]="true" [(visible)]="change_password" [style]="{ width: '90%' }">
    <form action="" [formGroup]="changePasswordForm" (ngSubmit)="updatePassword()">
        <span class="p-text-secondary block mb-2">Enter new password</span>
        <div class="mb-3">
            <p-floatlabel variant="on">
                <p-password inputId="on_label" [toggleMask]="true" [feedback]="false" class="w-full"
                    inputStyleClass="w-full" styleClass="w-full" formControlName="password">
                </p-password>
                <label for=" on_label">Password</label>
            </p-floatlabel>
        </div>
        <div class="flex justify-end gap-2">
            <p-button label="Cancel" severity="secondary" [rounded]="true" />
            <p-button label="Update" [rounded]="true" type="submit" [disabled]="changePasswordForm.invalid" />
        </div>
    </form>
</p-dialog>

<p-button icon="pi pi-user-plus" severity="primary" outline="true" [rounded]="true" class="fixed bottom-18 right-3"
    routerLink="/add-new-user" pTooltip="New user" tooltipPosition="top"></p-button>
