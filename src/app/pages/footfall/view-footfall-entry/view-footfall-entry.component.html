<div class="flex justify-between items-center mb-4">
  <h1 class="text-lg font-semibold flex items-center gap-2">
    <p-avatar
      [label]="username.charAt(0)"
      shape="circle"
      class="bg-amber-50 border-1 text-white"
    ></p-avatar>
    {{ username }}
  </h1>
  <div>
    <p-datepicker
      [(ngModel)]="selectedMonth"
      view="month"
      dateFormat="mm/yy"
      (onSelect)="onMonthChange($event)"
      placeholder="Select Month"
      class="w-full"
      styleClass="max-sm:w-full"
      [showClear]="true"
    ></p-datepicker>
  </div>
</div>

<p-card>
  <p-table
    [value]="filteredFootEntries()"
    [paginator]="true"
    [rows]="31"
    stripedRows=""
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="timestamp">
          Date
          <p-sortIcon field="timestamp" />
        </th>
        <th pSortableColumn="footfall">
          Footfall
          <p-sortIcon field="footfall" />
        </th>
        <th pSortableColumn="conversion">
          Conversion
          <p-sortIcon field="conversion" />
        </th>
        <th>Conversion %</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-entry>
      <tr>
        <td>{{ entry.timestamp | date : "d/MMM/y" }}</td>
        <td>{{ entry.footfall }}</td>
        <td>{{ entry.conversion }}</td>
        <td>
          <p-tag
            [value]="
              entry.footfall
                ? ((entry.conversion / entry.footfall) * 100
                    | number : '1.0-2') + '%'
                : '0%'
            "
            [severity]="
              entry.footfall
                ? (entry.conversion / entry.footfall) * 100 < 40
                  ? 'danger'
                  : (entry.conversion / entry.footfall) * 100 < 60
                  ? 'warning'
                  : 'success'
                : 'danger'
            "
          ></p-tag>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
