<!-- Header -->
<div class="flex justify-between items-center">
  <h2 class="text-xl font-semibold">All Users</h2>
  <p-button
    icon="pi pi-plus"
    class="mt-3 right-3"
    severity="contrast"
    label="Add New"
    size="small"
    (onClick)="displayBasic = true"
  ></p-button>
</div>

<!-- Users Table -->
<p-card class="mt-3 block">
  @if(allUsers && allUsers.length !== 0) {
  <p-table
    [value]="allUsers"
    stripedRows
    size="small"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 30]"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user let-i="rowIndex">
      @if(user.username !== 'admin') {
      <tr>
        <td>{{ i + 1 }}</td>
        <td>{{ user.username | titlecase }}</td>
        <td>{{ user.role | titlecase }}</td>
        <td>
          <p-button
            [text]="true"
            severity="contrast"
            icon="pi pi-ellipsis-h"
            [rounded]="true"
            pTooltip="Action"
            tooltipPosition="bottom"
            (click)="selectUserForPasswordChange(user._id)"
          ></p-button>
        </td>
      </tr>
      }
    </ng-template>
  </p-table>
  } @else {
  <p-card>
    <div class="flex justify-content-center align-items-center p-5">
      <h3 class="text-gray-500 text-xl">No Users Found</h3>
    </div>
  </p-card>
  }
</p-card>

<!-- Change Password / Delete Drawer -->
<p-drawer
  header="Change Password"
  [modal]="true"
  [(visible)]="change_password"
  position="bottom"
  [style]="{ height: '100%', width: '25%' }"
  styleClass="!w-full md:!w-80 lg:!w-[30rem]"
>
  <form [formGroup]="changePasswordForm" (ngSubmit)="updatePassword(selectedUserId)">
    <span class="p-text-secondary block mb-2">Enter new password</span>
    <div class="mb-3">
      <p-floatlabel variant="on">
        <p-password
          inputId="new_password"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full "
          inputStyleClass="w-full "
          formControlName="password"
        ></p-password>
        <label for="new_password">Password</label>
      </p-floatlabel>
    </div>

    <div class="flex justify-between gap-2">
      <!-- Delete Button -->
      <p-button
        icon="pi pi-trash"
        [text]="true"
        severity="danger"
        [rounded]="true"
        pTooltip="Delete"
        tooltipPosition="bottom"
        (click)="deleteCustomer(selectedUserId)"
      ></p-button>

      <!-- Update Button -->
      <div class="flex gap-4">
        <p-button
          severity="contrast"
          label="Update"
          [rounded]="true"
          type="submit"
          [disabled]="changePasswordForm.invalid"
        ></p-button>
      </div>
    </div>
  </form>
</p-drawer>

<!-- Add New User Drawer -->
<p-drawer
  header="Add New User"
  [(visible)]="displayBasic"
  [closable]="true"
  position="bottom"
  [style]="{ height: '100%', width: '25%' }"
  styleClass="!w-full md:!w-80 lg:!w-[30rem]"
>
  <app-add-new-user
    (close)="this.getAllCustomer(); displayBasic = false"
  ></app-add-new-user>
</p-drawer>
