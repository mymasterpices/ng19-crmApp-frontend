<div class="card pb-6 mb-6">
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="">
      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input pInputText id="party" formControlName="party" class="w-full" />
          <label for="party">Party Name</label>
        </p-floatlabel>
        @if (
          productForm.controls["party"].invalid &&
          productForm.controls["party"].touched
        ) {
          <p>Party name is mandatory</p>
        }
      </div>

      <!-- KARIGAR -->
      <div class="col-12 field mt-3">
        <p-select
          [options]="karigarList"
          optionLabel="name"
          optionValue="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          placeholder="Karigar"
          class="w-full"
          formControlName="karigari"
        ></p-select>
      </div>

      <!-- SALESPERSON -->
      <div class="col-12 field mt-3">
        <p-select
          [options]="salespersonList"
          optionLabel="name"
          optionValue="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          placeholder="Sales Person"
          class="w-full"
          formControlName="salesperson"
        ></p-select>
      </div>

      <!-- ── IMAGE FIELD ─────────────────────────────────────────────────── -->
      <div class="col-12 field mt-3">
        <!-- Pre-selected reference image indicator -->
        @if (imagePreviewUrl() && !userSelectedFile()) {
          <div
            class="flex items-center gap-3 px-3 py-2 mb-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800"
          >
            <img
              [src]="imagePreviewUrl()!"
              alt="pre-selected"
              class="w-10 h-10 rounded-md object-cover shrink-0 border border-emerald-200"
            />
            <div class="flex-1 min-w-0">
              <p
                class="text-xs font-medium text-emerald-700 dark:text-emerald-400"
              >
                ✓ Image pre-selected
              </p>
              <p class="text-xs text-emerald-600/70 truncate">
                {{ uploadedFile?.name }}
              </p>
            </div>
            <button
              type="button"
              class="text-emerald-600 hover:text-red-500 transition-colors"
              (click)="removeImage()"
              title="Remove"
            >
              <i class="pi pi-times text-xs"></i>
            </button>
          </div>
        }

        <p-fileupload
          mode="advanced"
          [multiple]="false"
          accept="image/*"
          [customUpload]="true"
          (onSelect)="onFileSelect($event)"
          (onRemove)="onFileRemove()"
          [showUploadButton]="false"
          [showCancelButton]="true"
          chooseLabel="Add Image"
          styleClass="w-full !p-0"
          name="imageProduct"
        ></p-fileupload>
      </div>
      <!-- ── END IMAGE FIELD ─────────────────────────────────────────────── -->

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <p-datepicker
            id="deliveryDate"
            formControlName="deliveryDate"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
            [touchUI]="true"
            appendTo="body"
            styleClass="w-full"
            class="w-full"
          ></p-datepicker>
          <label for="deliveryDate">Delivery Date</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <p-inputNumber
            id="quantity"
            formControlName="quantity"
            [showButtons]="true"
            class="w-full"
            min="1"
          ></p-inputNumber>
          <label for="quantity">Quantity</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="goldweight"
            formControlName="goldWeight"
            class="w-full"
          />
          <label for="goldWeight">Gold Weight (g)</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="diamondDetails"
            formControlName="diamondDetails"
            class="w-full"
          />
          <label for="diamondDetails">Diamond Details</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="stoneDetails"
            formControlName="stoneDetails"
            class="w-full"
          />
          <label for="stoneDetails">Stone Details</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="purity"
            formControlName="purity"
            class="w-full"
          />
          <label for="purity">Purity*</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="goldColor"
            formControlName="goldColor"
            class="w-full"
          />
          <label for="goldColor">Gold Color</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input pInputText id="size" formControlName="size" class="w-full" />
          <label for="size">Size</label>
        </p-floatlabel>
      </div>

      <!-- CATEGORY -->
      <div class="col-12 field mt-3">
        <p-select
          [options]="categoryList"
          optionLabel="name"
          optionValue="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          placeholder="Item Category"
          class="w-full"
          formControlName="itemCategory"
        ></p-select>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="gatiOrderNo"
            formControlName="gatiOrderNo"
            class="w-full"
          />
          <label for="gatiOrderNo">Gati Order No</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="productCode"
            formControlName="productCode"
            class="w-full"
          />
          <label for="productCode">Product Code</label>
        </p-floatlabel>
      </div>

      <div class="col-12 field mt-3">
        <p-floatlabel variant="on">
          <textarea
            pTextarea
            id="remarks"
            formControlName="remarks"
            rows="2"
            class="w-full"
          ></textarea>
          <label for="remarks">Remarks*</label>
        </p-floatlabel>
      </div>

      <div
        class="col-12 mt-3 fixed bottom-0 left-0 right-0 p-3 flex justify-center items-center w-full"
      >
        <p-button
          label="Create Order"
          icon="pi pi-shopping-cart"
          type="submit"
          size="small"
          severity="contrast"
          styleClass="w-full"
          [loading]="isSaving()"
          [disabled]="productForm.invalid"
        ></p-button>
      </div>
    </div>
  </form>
</div>
