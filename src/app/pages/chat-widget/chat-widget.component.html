<section
  role="dialog"
  aria-label="Store assistant chat"
  class="flex h-full max-h-[calc(100vh-96px)] w-full max-w-[calc(100vw-32px)] flex-col overflow-hidden rounded-[18px]"
>
  <!-- Messages -->
  <div #scrollContainer class="flex flex-1 flex-col gap-3 overflow-y-auto pb-4">
    @for (msg of messages(); track msg.id) {
      <div class="flex" [class.justify-end]="msg.role === 'user'">
        @if (msg.role === "assistant") {
          <div
            class="prose prose-sm prose-amethyst max-w-[84%] rounded-2xl rounded-bl-md text-zinc-200 bg-zinc-950 dark:bg-zinc-800 px-3.5 py-2.5 leading-relaxed overflow-auto"
            [class.border-amethyst-100]="!msg.isError"
            [class.bg-amethyst-50]="!msg.isError"
            [class.border-red-400]="msg.isError"
            [class.bg-red-50]="msg.isError"
            [class.text-red-600]="msg.isError"
            [innerHTML]="msg.content | safeMarkdown"
          ></div>
        } @else {
          <div
            class="max-w-[84%] rounded-2xl rounded-br-md bg-gradient-to-br from-amethyst-500 to-amethyst-400 px-3.5 py-2.5 leading-relaxed bg-zinc-200 dark:bg-zinc-300 dark:text-zinc-900 overflow-auto"
          >
            {{ msg.content }}
          </div>
        }
      </div>
    }

    @if (isLoading()) {
      <div class="flex">
        <div
          class="flex items-center gap-1 rounded-2xl rounded-bl-md border border-zinc-100 bg-amethyst-50 px-3.5 py-3"
          aria-label="Assistant is typing"
        >
          <span
            class="dot h-1.5 w-1.5 rounded-full bg-zinc-500"
            style="animation-delay: 0s"
          ></span>
          <span
            class="dot h-1.5 w-1.5 rounded-full bg-zinc-500"
            style="animation-delay: 0.15s"
          ></span>
          <span
            class="dot h-1.5 w-1.5 rounded-full bg-zinc-500"
            style="animation-delay: 0.3s"
          ></span>
        </div>
      </div>
    }
  </div>

  <!-- Input -->
  <footer class="flex items-center gap-1">
    <input
      type="text"
      pInputText
      class="!rounded-full flex-1 h-15"
      placeholder="Ask about revenue, targets, performance…"
      [(ngModel)]="userInput"
      (keydown)="onKeydown($event)"
      [disabled]="isLoading()"
    />
    <p-button
      type="button"
      pButton
      size="large"
      severity="contrast"
      icon="pi pi-send"
      class="!h-[45px] !w-[45px] !rounded-full !border-amethyst-500 !bg-amethyst-500"
      [disabled]="isLoading() || !userInput.trim()"
      (click)="sendMessage()"
      aria-label="Send message"
    ></p-button>
  </footer>
</section>
