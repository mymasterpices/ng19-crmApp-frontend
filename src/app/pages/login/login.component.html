<div class="bg-surface-700 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw]
    overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div
            style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="bg-surface-0 dark:bg-surface-900" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <div class="flex items-center justify-center mb-3">
                        <img src="img/logo.png" alt="" class="w-8">
                    </div>
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Welcome to <span
                            class="font-normal">crmapp</span>
                    </div>
                    <span class="text-muted-color font-normal">Sign In to continue</span>
                </div>

                <form [formGroup]="loginFrom" (ngSubmit)="onSubmit()">
                    <p-floatlabel variant="on" class="mb-5">
                        <input pInputText formControlName="username" id="username" type="text"
                            class="w-full md:w-[30rem]" autocomplete="off" />
                        <label for="username" class="block font-normal mb-1">Username</label>
                    </p-floatlabel>

                    <p-floatlabel variant="on" class="mb-5">
                        <p-password formControlName="password" [toggleMask]="true" [feedback]="false" class="w-full"
                            inputStyleClass="w-full" styleClass="w-full" autocomplete="off">
                        </p-password>
                        <label for="password" class="block  text-md font-normal mb-1">Password</label>
                    </p-floatlabel>

                    <p-button label="Sign In" styleClass="w-full" type="submit"></p-button>
                </form>
            </div>
        </div>
    </div>
</div>
